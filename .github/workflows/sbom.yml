# Generates a CycloneDX SBOM for this repository and uploads it to
# Dependency-Track at dtrack.sizeless.co.
#
# Everything real lives in the reusable workflow this calls: SBOM generation,
# authentication through IAP, and the upload. See
# sizeless-tech/infra-internal/.github/workflows/sbom.yml, and
# docs/runbooks/dependency-track.md in that repository for how it is operated.
#
# ecosystem: other -- No supported manifest at the repository root, so this gets a filesystem scan with Syft. Deliberately shallower: it still makes the repository PRESENT in Dependency-Track, so its thinness shows up as data rather than as a silent gap in coverage. Syft walks the whole tree, so nested manifests are still picked up.
#
# The weekly cron is not about new CVEs. Dependency-Track re-analyses the whole
# portfolio daily on its own, with no CI involvement, so a new advisory appears
# against this project's existing SBOM without anything being re-uploaded. The
# cron proves the PIPELINE still works in a repository nobody has committed to
# in months, which is the failure a coverage report cannot see: a project that
# reported once looks covered forever.

name: SBOM

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sbom:
    uses: sizeless-tech/infra-internal/.github/workflows/sbom.yml@main
    with:
      ecosystem: other
    secrets: inherit
